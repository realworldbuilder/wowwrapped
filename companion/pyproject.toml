[project]
name = "wowwrapped"
version = "0.1.0"
description = "WoWwrapped Mac companion: archives World of Warcraft: Forever adventure sessions and turns them into journals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
wrapped = "wowwrapped.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowwrapped"]

# Ship the AddOn inside the wheel so `uv tool install` from GitHub needs no checkout.
[tool.hatch.build.targets.wheel.force-include]
"../addon/WoWwrapped/WoWwrapped.toc" = "wowwrapped/addon/WoWwrapped/WoWwrapped.toc"
"../addon/WoWwrapped/WoWwrapped_Camelot.toc" = "wowwrapped/addon/WoWwrapped/WoWwrapped_Camelot.toc"
"../addon/WoWwrapped/Forever.lua" = "wowwrapped/addon/WoWwrapped/Forever.lua"
"../addon/WoWwrapped/Util.lua" = "wowwrapped/addon/WoWwrapped/Util.lua"
"../addon/WoWwrapped/EventTypes.lua" = "wowwrapped/addon/WoWwrapped/EventTypes.lua"
"../addon/WoWwrapped/Core.lua" = "wowwrapped/addon/WoWwrapped/Core.lua"
"../addon/WoWwrapped/Session.lua" = "wowwrapped/addon/WoWwrapped/Session.lua"
"../addon/WoWwrapped/Journal.lua" = "wowwrapped/addon/WoWwrapped/Journal.lua"
"../addon/WoWwrapped/Events.lua" = "wowwrapped/addon/WoWwrapped/Events.lua"
"../addon/WoWwrapped/UI.lua" = "wowwrapped/addon/WoWwrapped/UI.lua"
"../addon/WoWwrapped/Commands.lua" = "wowwrapped/addon/WoWwrapped/Commands.lua"
"../addon/WoWwrapped/Bindings.xml" = "wowwrapped/addon/WoWwrapped/Bindings.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
